<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11110f" />
    <meta name="description" content="Features — essays, projects, notes, and ongoing work by Frank." />
    <title>Features — Index</title>
    <style>
      :root { --paper:#f1f0eb; --ink:#11110f; --muted:#6b6961; --line:rgba(17,17,15,.2); --accent:#e33b2e; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
      a { color:inherit; }
      .page { width:min(100% - 32px,1500px); min-height:100vh; margin:auto; display:flex; flex-direction:column; }
      nav { min-height:68px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
      .brand,.nav-link { font-size:.78rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; text-decoration:none; }
      .brand { display:flex; align-items:center; gap:11px; }
      .mark { width:10px; height:10px; border-radius:50%; background:var(--accent); }
      .nav-links { display:flex; gap:28px; }
      .nav-link:hover { text-decoration:underline; text-underline-offset:5px; }
      main { flex:1; display:grid; grid-template-columns:1fr 2fr; gap:32px; padding:clamp(56px,9vw,130px) 0; }
      .kicker { margin:10px 0 0; color:var(--muted); font-size:.74rem; letter-spacing:.13em; text-transform:uppercase; }
      h1 { margin:0; font:400 clamp(5.2rem,13vw,13rem)/.78 Georgia,'Times New Roman',serif; letter-spacing:-.07em; }
      .intro { grid-column:2; display:grid; grid-template-columns:1.4fr 1fr; gap:40px; margin-top:clamp(42px,7vw,92px); padding-top:25px; border-top:1px solid var(--line); }
      .intro p { margin:0; }
      .lead { max-width:34ch; font:400 clamp(1.45rem,2.4vw,2.65rem)/1.14 Georgia,'Times New Roman',serif; letter-spacing:-.025em; }
      .note { max-width:34ch; color:var(--muted); }
      footer { display:flex; justify-content:space-between; gap:24px; padding:22px 0 28px; border-top:1px solid var(--line); color:var(--muted); font-size:.72rem; letter-spacing:.11em; text-transform:uppercase; }
      @media(max-width:760px){ .page{width:min(100% - 22px,1500px)} nav{min-height:58px}.nav-links{gap:16px} main{grid-template-columns:1fr;padding-top:50px} h1{font-size:clamp(4.4rem,23vw,8rem)} .intro{grid-column:1;grid-template-columns:1fr;gap:24px} }
    </style>
  </head>
  <body>
    <div class="page">
      <nav aria-label="Primary navigation">
        <a class="brand" href="../"><span class="mark" aria-hidden="true"></span>Index</a>
        <div class="nav-links"><a class="nav-link" href="./">Features</a><a class="nav-link" href="../photographs/">Photographs</a></div>
      </nav>
      <main>
        <p class="kicker">Essays · Projects · Notes</p>
        <h1>Fea-<br />tures</h1>
        <section class="intro" aria-label="Features introduction">
          <p class="lead">A space for work that needs more than a single frame.</p>
          <p class="note">Long-form stories, projects, experiments, and field notes will live here. The first feature is in progress.</p>
        </section>
      </main>
      <footer><span>Features / Index</span><span>New work in progress</span></footer>
    </div>
  </body>
</html>
