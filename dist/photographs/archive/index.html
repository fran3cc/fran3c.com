    <title>Photographs — Complete Archive</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111111'/%3E%3Cpath d='M15 14h34v8H24v8h20v8H24v12h-9z' fill='%23f1f0eb'/%3E%3Ccircle cx='49' cy='49' r='5' fill='%23e33b2e'/%3E%3C/svg%3E" />
    <style>
      :root {
        --paper: #f1f0eb;
        --ink: #11110f;
        --muted: #77756d;
        --line: rgba(17, 17, 15, 0.2);
        --accent: #e33b2e;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      img { display: block; width: 100%; height: auto; }
      button { font: inherit; }
      a { color: inherit; }
      .page { width: min(100% - 32px, 1500px); margin: 0 auto; }
      .nav {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 68px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--paper) 92%, transparent);
        backdrop-filter: blur(12px);
      }
      .brand, .back {
        text-decoration: none;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .brand { display: inline-flex; align-items: center; gap: 11px; }
      .brand-mark { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
      .back:hover { text-decoration: underline; text-underline-offset: 5px; }
      header {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 32px;
        padding: clamp(50px, 8vw, 118px) 0 clamp(44px, 6vw, 90px);
        border-bottom: 1px solid var(--line);
      }
      .kicker {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.76rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        max-width: 900px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(4.1rem, 10vw, 10rem);
        font-weight: 400;
        line-height: 0.8;
        letter-spacing: -0.065em;
      }
      .header-meta {
        grid-column: 2;
        display: flex;
        justify-content: space-between;
        gap: 24px;
        margin-top: 34px;
        color: var(--muted);
      }
      .header-meta p { margin: 0; max-width: 44ch; }
      .count {
        color: var(--ink);
        font-size: 1rem;
        letter-spacing: 0.08em;
        white-space: nowrap;
        text-transform: uppercase;
      }
      .archive {
        padding: clamp(52px, 7vw, 105px) 0 clamp(85px, 10vw, 150px);
        columns: 3;
        column-gap: 14px;
      }
      .frame {
        display: inline-block;
        width: 100%;
        margin: 0 0 clamp(28px, 3.8vw, 58px);
        break-inside: avoid;
      }
      .frame-button {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: #d8d5ce;
        cursor: zoom-in;
        overflow: hidden;
      }
      .frame-button img { transition: transform 650ms cubic-bezier(.2,.7,.2,1); }
      .frame-button:hover img { transform: scale(1.012); }
      .frame-button:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 9px;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 0 28px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      dialog {
        width: 100vw;
        max-width: none;
        height: 100vh;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: rgba(8, 8, 8, 0.98);
        color: white;
      }
      dialog::backdrop { background: rgba(8, 8, 8, 0.98); }
      .viewer { position: relative; display: grid; place-items: center; width: 100%; height: 100%; padding: 60px 6vw 52px; }
      .viewer img { width: auto; max-width: 100%; height: auto; max-height: calc(100vh - 125px); object-fit: contain; }
      .viewer-close {
        position: absolute;
        top: 18px;
        right: 20px;
        border: 0;
        background: transparent;
        color: white;
        cursor: pointer;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .viewer-control {
        position: absolute;
        top: 50%;
        width: 52px;
        height: 52px;
        border: 1px solid rgba(255,255,255,.32);
        border-radius: 50%;
        background: rgba(0,0,0,.2);
        color: white;
        cursor: pointer;
        font-size: 1.35rem;
        transform: translateY(-50%);
      }
      .viewer-prev { left: 18px; }
      .viewer-next { right: 18px; }
      .viewer-count {
        position: absolute;
        left: 20px;
        bottom: 17px;
        color: #aaa;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .reveal { opacity: 0; transform: translateY(16px); transition: opacity 600ms ease, transform 600ms ease; }
      .reveal.visible { opacity: 1; transform: none; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition-duration: .01ms !important; }
        .reveal { opacity: 1; transform: none; }
      }
      @media (max-width: 860px) {
        .archive { columns: 2; }
        header { grid-template-columns: 1fr; }
        .header-meta { grid-column: 1; }
      }
      @media (max-width: 560px) {
        .page { width: min(100% - 22px, 1500px); }
        .nav { min-height: 58px; }
        header { gap: 20px; }
        h1 { font-size: clamp(4rem, 20vw, 6.4rem); }
        .header-meta { display: block; margin-top: 18px; }
        .count { margin-top: 18px !important; }
        .archive { columns: 1; column-gap: 0; }
        .viewer { padding: 56px 10px 54px; }
        .viewer-control { top: auto; bottom: 10px; transform: none; width: 42px; height: 42px; }
        .viewer-prev { left: calc(50% - 52px); }
        .viewer-next { right: calc(50% - 52px); }
        .viewer-count { left: 12px; }
      }
    </style>
  </head>

      </main>
      <footer><span>Photographs / Archive</span><span>50 photographs</span></footer>
    </div>
    <dialog id="viewer" aria-label="Expanded photograph">
      <div class="viewer">
        <button class="viewer-close" type="button">Close ×</button>
        <button class="viewer-control viewer-prev" type="button" aria-label="Previous photograph">←</button>
        <img src="" alt="" />
        <button class="viewer-control viewer-next" type="button" aria-label="Next photograph">→</button>
        <span class="viewer-count"></span>
      </div>
    </dialog>
    <script>
      const frames = ["img_0047.webp","img_0296.webp","img_0386.webp","img_0453.webp","img_0752.webp","img_0772.webp","img_1411.webp","img_1809.webp","img_1828.webp","img_1836.webp","img_1842.webp","img_1895.webp","img_1929.webp","img_1994.webp","img_2002.webp","img_2029.webp","img_2034.webp","img_2300.webp","img_2528.webp","img_2727.webp","img_2838.webp","img_2862.webp","img_2867.webp","img_2873.webp","img_2920.webp","img_3137.webp","img_3139.webp","img_3145.webp","img_3155.webp","img_3165.webp","img_3912.webp","img_3998.webp","img_4005.webp","img_4011.webp","img_4026.webp","img_4028.webp","img_4035.webp","img_4040.webp","img_4042.webp","img_4067.webp","img_4068.webp","img_4166.webp","img_4188.webp","img_4200.webp","img_4263.webp","img_4266.webp","img_4375.webp","img_4404.webp","img_6312.webp","img_6330.webp"];
      const dialog = document.querySelector('#viewer');
      const viewerImage = dialog.querySelector('img');
      const viewerCount = dialog.querySelector('.viewer-count');
      let current = 0;

      function showPhoto(index) {
        current = (index + frames.length) % frames.length;
        viewerImage.src = 'images/' + frames[current];
        viewerImage.alt = 'Photograph ' + String(current + 1).padStart(2, '0') + ' from the Photographs archive';
        viewerCount.textContent = String(current + 1).padStart(2, '0') + ' / ' + frames.length;
      }

      document.querySelectorAll('.frame-button').forEach((button) => {
        button.addEventListener('click', () => {
          showPhoto(Number(button.dataset.index));
          dialog.showModal();
        });
      });
      dialog.querySelector('.viewer-close').addEventListener('click', () => dialog.close());
      dialog.querySelector('.viewer-prev').addEventListener('click', () => showPhoto(current - 1));
      dialog.querySelector('.viewer-next').addEventListener('click', () => showPhoto(current + 1));
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close();
      });
      document.addEventListener('keydown', (event) => {
        if (!dialog.open) return;
        if (event.key === 'ArrowLeft') showPhoto(current - 1);
        if (event.key === 'ArrowRight') showPhoto(current + 1);
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08 });
      document.querySelectorAll('.reveal').forEach((element) => observer.observe(element));
    </script>
  </body>
