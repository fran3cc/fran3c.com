<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f0eb" />
    <meta name="description" content="Photographs — a personal archive of fifty images by Frank." />
    <title>Photographs — Frank’s Index</title>
    <link rel="icon" type="image/png" href="../images/fran3c-avatar.png" />
    <link rel="apple-touch-icon" href="../images/fran3c-avatar.png" />
    <style>
      :root {
        --paper: #f1f0eb;
        --ink: #11110f;
        --muted: #68675f;
        --line: rgba(17, 17, 15, 0.2);
        --accent: #e33b2e;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      img { display: block; width: 100%; }
      a { color: inherit; }
      button { font: inherit; }

      .page { width: min(100% - 32px, 1500px); margin: 0 auto; }
      .nav {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 68px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--paper) 92%, transparent);
        backdrop-filter: blur(12px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        text-decoration: none;
        font-size: 0.84rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
      .nav-links { display: flex; gap: 30px; }
      .nav-links a {
        text-decoration: none;
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .nav-links a:hover { text-decoration: underline; text-underline-offset: 5px; }
      .section-nav { display:flex; justify-content:flex-end; gap:22px; padding:15px 0; border-bottom:1px solid var(--line); }
      .section-nav a { color:var(--muted); font-size:.7rem; font-weight:700; letter-spacing:.11em; text-decoration:none; text-transform:uppercase; }
      .section-nav a:hover { color:var(--ink); text-decoration:underline; text-underline-offset:5px; }

      .masthead { padding: clamp(42px, 7vw, 108px) 0 26px; }
      .eyebrow {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
        color: var(--muted);
        font-size: 0.74rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(4.25rem, 13.7vw, 13.5rem);
        font-weight: 400;
        line-height: 0.78;
        letter-spacing: -0.07em;
      }

      .hero {
        position: relative;
        overflow: hidden;
        background: #161616;
        aspect-ratio: 16 / 9;
      }
      .hero img { height: 100%; object-fit: cover; object-position: center 57%; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
      .hero:hover img { transform: scale(1.018); }
      .hero-index {
        position: absolute;
        right: 18px;
        bottom: 16px;
        color: #fff;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        mix-blend-mode: difference;
      }
      .hero-location {
        position: absolute;
        left: 18px;
        bottom: 16px;
        color: #fff;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        mix-blend-mode: difference;
      }

      .intro {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 34px;
        padding: 28px 0 clamp(80px, 11vw, 160px);
        border-bottom: 1px solid var(--line);
      }
      .intro p { margin: 0; }
      .intro-copy {
        max-width: 680px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(1.35rem, 2.25vw, 2.45rem);
        line-height: 1.16;
        letter-spacing: -0.025em;
      }
      .section-label { font-size: 0.72rem; letter-spacing: 0.13em; text-transform: uppercase; }

      .gallery { padding: clamp(72px, 9vw, 135px) 0; }
      .gallery-head {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 34px;
        align-items: end;
        margin-bottom: clamp(32px, 5vw, 70px);
      }
      .gallery-head h2 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(2.6rem, 5vw, 5.7rem);
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: -0.05em;
      }
      .archive-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 22px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--ink);
        text-decoration: none;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .archive-link span { transition: transform 220ms ease; }
      .archive-link:hover span { transform: translateX(5px); }
      .gallery-head > .archive-link { justify-self: start; margin-top: 0; }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        column-gap: 18px;
        row-gap: clamp(56px, 8vw, 120px);
      }
      .photo { margin: 0; }
      .photo:nth-child(6n + 1) { grid-column: 1 / span 7; }
      .photo:nth-child(6n + 2) { grid-column: 9 / -1; margin-top: 12vw; }
      .photo:nth-child(6n + 3) { grid-column: 2 / span 4; }
      .photo:nth-child(6n + 4) { grid-column: 7 / -1; margin-top: 7vw; }
      .photo:nth-child(6n + 5) { grid-column: 1 / span 5; margin-top: 4vw; }
      .photo:nth-child(6n) { grid-column: 7 / span 5; }

      .photo-button {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: #d7d5cd;
        cursor: zoom-in;
        overflow: hidden;
      }
      .photo-button img { transition: transform 700ms cubic-bezier(.2,.7,.2,1), filter 300ms; }
      .photo-button:hover img { transform: scale(1.015); }
      .photo-button:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
      .landscape img { aspect-ratio: 3 / 2; object-fit: cover; }
      .portrait img { aspect-ratio: 2 / 3; object-fit: cover; }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 11px;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 0 28px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      footer span:last-child { letter-spacing: 0.04em; text-transform: none; }

      dialog {
        width: 100vw;
        max-width: none;
        height: 100vh;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: rgba(8, 8, 8, 0.97);
        color: #fff;
      }
      dialog::backdrop { background: rgba(8, 8, 8, 0.97); }
      .lightbox-inner { position: relative; display: grid; place-items: center; width: 100%; height: 100%; padding: 58px 5vw 48px; }
      .lightbox-image { width: auto; max-width: 100%; height: auto; max-height: calc(100vh - 120px); object-fit: contain; }
      .lightbox-close {
        position: absolute;
        top: 18px;
        right: 20px;
        border: 0;
        background: transparent;
        color: #fff;
        cursor: pointer;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .lightbox-caption { position: absolute; left: 20px; bottom: 17px; color: #aaa; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }

      .reveal { opacity: 0; transform: translateY(18px); transition: opacity 700ms ease, transform 700ms ease; }
      .reveal.visible { opacity: 1; transform: none; }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        .reveal { opacity: 1; transform: none; }
      }

      @media (max-width: 760px) {
        .page { width: min(100% - 22px, 1500px); }
        .nav { min-height: 58px; }
        .nav-links { gap: 17px; }
        .section-nav { justify-content:flex-start; }
        .masthead { padding-top: 42px; }
        h1 { font-size: clamp(4rem, 20vw, 7.2rem); line-height: 0.82; }
        .hero { aspect-ratio: 4 / 5; }
        .hero img { object-position: 50% 50%; }
        .intro, .gallery-head { grid-template-columns: 1fr; }
        .intro { gap: 24px; }
        .gallery-head { gap: 20px; }
        .photo-grid { grid-template-columns: 1fr 1fr; gap: 48px 12px; }
        .photo:nth-child(n) { grid-column: auto; margin-top: 0; }
        .photo:nth-child(3n + 1) { grid-column: 1 / -1; }
        footer { align-items: flex-end; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="nav" aria-label="Primary navigation">
        <a class="brand" href="../"><img class="brand-avatar" src="../images/fran3c-avatar.png" alt="" />FRAN3C</a>
        <div class="nav-links">
          <a href="../features/">Experience</a>
          <a href="#top">Photographs</a>
        </div>
      </nav>
      <nav class="section-nav" aria-label="Photograph sections"><a href="#gallery">Selected</a><a href="archive/">All 50 ↗</a></nav>

      <main id="top">
        <header class="masthead">
          <div class="eyebrow"><span>Photographs</span><span>Personal archive · 2026</span></div>
          <h1>Photo-<br />graphs</h1>
        </header>

        <div class="hero reveal">
          <img src="../images/bridge.jpg" alt="Looking upward into the Golden Gate Bridge in fog" fetchpriority="high" />
          <span class="hero-location">Golden Gate Bridge, California</span>
          <span class="hero-index">01 / 15</span>
        </div>

        <section class="gallery" id="gallery">
          <div class="gallery-head reveal">
            <h2>Selected<br />frames</h2>
            <a class="archive-link" href="archive/">View all 50 photographs <span aria-hidden="true">→</span></a>
          </div>

          <div class="photo-grid">
            <figure class="photo reveal">
              <button class="photo-button landscape" data-src="archive/images/img_0752.webp" data-caption="Sanxia, Chongqing / 02" aria-label="Open photograph from Sanxia, Chongqing">
                <img src="archive/images/img_0752.webp" alt="Sanxia, Chongqing" loading="lazy" />
              </button>
              <figcaption><span>Sanxia, Chongqing</span><span>02</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button landscape" data-src="archive/images/img_0772.webp" data-caption="Griffith Observatory, Los Angeles / 03" aria-label="Open photograph from Griffith Observatory, Los Angeles">
                <img src="archive/images/img_0772.webp" alt="Griffith Observatory, Los Angeles" loading="lazy" />
              </button>
              <figcaption><span>Griffith Observatory, Los Angeles</span><span>03</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button portrait" data-src="archive/images/img_1828.webp" data-caption="Museo Nacional de Bellas Artes, Santiago / 04" aria-label="Open photograph from Museo Nacional de Bellas Artes, Santiago">
                <img src="archive/images/img_1828.webp" alt="Museo Nacional de Bellas Artes, Santiago" loading="lazy" />
              </button>
              <figcaption><span>Museo Nacional de Bellas Artes, Santiago</span><span>04</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button landscape" data-src="archive/images/img_1929.webp" data-caption="Matanuska Glacier, Alaska / 05" aria-label="Open photograph from Matanuska Glacier, Alaska">
                <img src="archive/images/img_1929.webp" alt="Matanuska Glacier, Alaska" loading="lazy" />
              </button>
              <figcaption><span>Matanuska Glacier, Alaska</span><span>05</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button landscape" data-src="archive/images/img_2002.webp" data-caption="Atacama, Chile / 06" aria-label="Open photograph from Atacama, Chile">
                <img src="archive/images/img_2002.webp" alt="Atacama, Chile" loading="lazy" />
              </button>
              <figcaption><span>Atacama, Chile</span><span>06</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button landscape" data-src="archive/images/img_2300.webp" data-caption="Very Large Telescope (VLT), Chile / 07" aria-label="Open photograph from the Very Large Telescope in Chile">
                <img src="archive/images/img_2300.webp" alt="Very Large Telescope (VLT), Chile" loading="lazy" />
              </button>
              <figcaption><span>Very Large Telescope (VLT), Chile</span><span>07</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button landscape" data-src="archive/images/img_2838.webp" data-caption="Viña del Mar, Chile / 08" aria-label="Open photograph from Viña del Mar, Chile">
                <img src="archive/images/img_2838.webp" alt="Viña del Mar, Chile" loading="lazy" />
              </button>
              <figcaption><span>Viña del Mar, Chile</span><span>08</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button landscape" data-src="archive/images/img_2873.webp" data-caption="Valparaíso, Chile / 09" aria-label="Open photograph from Valparaíso, Chile">
                <img src="archive/images/img_2873.webp" alt="Valparaíso, Chile" loading="lazy" />
              </button>
              <figcaption><span>Valparaíso, Chile</span><span>09</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button portrait" data-src="archive/images/img_2920.webp" data-caption="Acadia, Maine / 10" aria-label="Open photograph from Acadia, Maine">
                <img src="archive/images/img_2920.webp" alt="Acadia, Maine" loading="lazy" />
              </button>
              <figcaption><span>Acadia, Maine</span><span>10</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button landscape" data-src="archive/images/img_3912.webp" data-caption="Lake Tahoe, California / 11" aria-label="Open photograph from Lake Tahoe, California">
                <img src="archive/images/img_3912.webp" alt="Lake Tahoe, California" loading="lazy" />
              </button>
              <figcaption><span>Lake Tahoe, California</span><span>11</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button landscape" data-src="archive/images/img_3998.webp" data-caption="Yosemite, California / 12" aria-label="Open photograph from Yosemite, California">
                <img src="archive/images/img_3998.webp" alt="Yosemite, California" loading="lazy" />
              </button>
              <figcaption><span>Yosemite, California</span><span>12</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button portrait" data-src="archive/images/img_4011.webp" data-caption="Biblioteca Vasconcelos, Mexico City / 13" aria-label="Open photograph from Biblioteca Vasconcelos, Mexico City">
                <img src="archive/images/img_4011.webp" alt="Biblioteca Vasconcelos, Mexico City" loading="lazy" />
              </button>
              <figcaption><span>Biblioteca Vasconcelos, Mexico City</span><span>13</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button portrait" data-src="archive/images/img_4375.webp" data-caption="Taipei 101 / 14" aria-label="Open photograph of Taipei 101">
                <img src="archive/images/img_4375.webp" alt="Taipei 101" loading="lazy" />
              </button>
              <figcaption><span>Taipei 101</span><span>14</span></figcaption>
            </figure>
            <figure class="photo reveal">
              <button class="photo-button portrait" data-src="archive/images/img_4266.webp" data-caption="Kaohsiung, Taiwan / 15" aria-label="Open photograph from Kaohsiung, Taiwan">
                <img src="archive/images/img_4266.webp" alt="Kaohsiung, Taiwan" loading="lazy" />
              </button>
              <figcaption><span>Kaohsiung, Taiwan</span><span>15</span></figcaption>
            </figure>
          </div>
        </section>

      </main>

      <footer><span>Photographs / 2026</span><span>Frank · Sihan Chen</span></footer>
    </div>

    <dialog id="lightbox" aria-label="Expanded photograph">
      <div class="lightbox-inner">
        <button class="lightbox-close" type="button">Close ×</button>
        <img class="lightbox-image" src="" alt="" />
        <span class="lightbox-caption"></span>
      </div>
    </dialog>

    <script>
      const dialog = document.querySelector('#lightbox');
      const expandedImage = dialog.querySelector('.lightbox-image');
      const expandedCaption = dialog.querySelector('.lightbox-caption');
      const closeButton = dialog.querySelector('.lightbox-close');

      document.querySelectorAll('.photo-button').forEach((button) => {
        button.addEventListener('click', () => {
          const sourceImage = button.querySelector('img');
          expandedImage.src = button.dataset.src;
          expandedImage.alt = sourceImage.alt;
          expandedCaption.textContent = button.dataset.caption;
          dialog.showModal();
        });
      });

      closeButton.addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close();
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      document.querySelectorAll('.reveal').forEach((element) => observer.observe(element));
    </script>
  </body>
</html>
